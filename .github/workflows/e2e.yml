name: Test the real apps (Windows, Mac, web)

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - run: npm ci

      - name: Build the installer
        run: npx tauri build --bundles nsis

      - name: Install it the way a user would (silent)
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Write-Host "installer: $($setup.FullName)"
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          Write-Host "installer exit code: $($p.ExitCode)"
          $exe = Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hells Factory Studio' -and $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) { throw 'installed app not found' }
          Write-Host "installed app: $($exe.FullName)"
          "APP_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Run the end-to-end test on the installed app
        shell: pwsh
        run: node e2e/run.mjs "$env:APP_EXE"

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - run: npm ci

      - name: Build the Mac app
        run: npx tauri build --bundles app

      - name: Start the Mac app and look at the screen
        run: |
          APP=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)
          echo "app: $APP"
          cp -R "$APP" /Applications/
          open "/Applications/$(basename "$APP")"
          sleep 20
          if pgrep -f "$(basename "$APP" .app)" > /dev/null; then echo "MAC_APP_RUNNING=yes"; else echo "MAC_APP_RUNNING=no"; fi
          screencapture -x shot.png || true
          sips -Z 1400 shot.png --out shot.jpg -s format jpeg > /dev/null 2>&1 || true
          echo "SHOT_BEGIN mac-app"; base64 -i shot.jpg; echo "SHOT_END"
          pgrep -f "$(basename "$APP" .app)" > /dev/null || { echo 'the Mac app is not running'; exit 1; }

      - name: Build the web version
        run: npm run build

      - name: Test with the Safari engine (WebKit, same as the Mac app)
        run: |
          npx playwright-core install webkit
          node e2e/web.mjs webkit

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Test the web version in Google Chrome
        run: PW_EXE=$(which google-chrome) node e2e/web.mjs chromium
