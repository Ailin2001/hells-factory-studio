name: Test the real Windows app

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Build the installer
        run: npx tauri build --bundles nsis

      - name: Install it the way a user would (silent)
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Write-Host "installer: $($setup.FullName)"
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          Write-Host "installer exit code: $($p.ExitCode)"
          $exe = Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hells Factory Studio' -and $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) { throw 'installed app not found' }
          Write-Host "installed app: $($exe.FullName)"
          "APP_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Install tauri-driver and Edge WebDriver
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool
          msedgedriver-tool.exe
          "NATIVE_DRIVER=$((Resolve-Path .\msedgedriver.exe).Path)" >> $env:GITHUB_ENV

      - name: Run the end-to-end test
        shell: pwsh
        run: node e2e/run.mjs "$env:APP_EXE"
